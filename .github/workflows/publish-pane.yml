name: Publish pane (tool only — no content, no decks)

# Deploys the assembler PANE as a static app to GitHub Pages: HTML/JS/CSS
# plus the edufair_renderer .py sources the in-browser (Pyodide) renderer
# imports. This publishes the TOOL, never content — no catalogs, no
# decks, no data directory. Rendering happens in each user's browser
# from markdown fetched straight out of git.
#
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the static pane (no data)
        run: |
          mkdir -p _site/py/edufair_renderer
          cp -r assembler/web/* _site/
          rm -rf _site/data _site/libraries
          cp renderer/src/edufair_renderer/*.py _site/py/edufair_renderer/
          # The Word pane renders through the word/ subpackage, which is
          # not matched by the glob above.
          mkdir -p _site/py/edufair_renderer/word
          cp renderer/src/edufair_renderer/word/*.py _site/py/edufair_renderer/word/
          # The landing page offers these for download; they live a level up.
          cp assembler/manifest.web.xml assembler/manifest.word.xml _site/
          # What a brand-new library is seeded from. Served from our own
          # origin rather than fetched out of git, so provisioning does not
          # depend on this repository's name or stay working by luck.
          mkdir -p _site/seed
          cp examples/template.pptx examples/layout-map.yaml              examples/layout-geometry.json examples/attribution.yaml _site/seed/
          # The workbench is the authoring SPA; same static hosting, same
          # /py/ modules, so it ships alongside the pane.
          mkdir -p _site/workbench
          cp workbench/*.js workbench/*.css workbench/*.html _site/workbench/
          rm -rf _site/workbench/node_modules
      - name: Stamp the build so no browser can serve a stale module
        run: |
          # ES modules are cached hard, and Pages sends max-age=600 on every
          # file. Without this, a deploy can leave someone running a mix of
          # old and new modules with no way to tell.
          #
          # This covers the task pane as well as the workbench. It did not,
          # and the pane runs inside an Office webview that caches harder
          # than a browser -- which is how a renamed logo went on 404ing
          # long after the deploy that renamed it.
          V="${GITHUB_SHA::8}"
          cd _site

          # Both ./ and ../ : preview.js imports ../wasm-renderer.js, and
          # for as long as this step has existed that one went unstamped.
          sed -i -E 's#from "[.]{1,2}/[A-Za-z0-9_.-]+[.]js#&?v='"$V"'#g' *.js workbench/*.js
          # Dynamic imports too. The pane loads its whole renderer through
          # one -- `await import("./wasm-renderer.js")` -- so missing these
          # left the largest module on the site cacheable and stale.
          sed -i -E 's#import[(]"[.]{1,2}/[A-Za-z0-9_.-]+[.]js#&?v='"$V"'#g' *.js workbench/*.js

          # Entry points are loaded by src/href, not by import.
          sed -i -E 's#src="taskpane[.]js#&?v='"$V"'#; s#href="taskpane[.]css#&?v='"$V"'#' taskpane.html
          sed -i -E 's#src="word-taskpane[.]js#&?v='"$V"'#; s#href="taskpane[.]css#&?v='"$V"'#' word-taskpane.html
          sed -i -E 's#href="taskpane[.]css#&?v='"$V"'#' index.html
          sed -i -E 's#src="app[.]js#&?v='"$V"'#; s#href="workbench[.]css#&?v='"$V"'#' workbench/index.html
          # And show it, so "which build am I on?" is answerable at a glance.
          sed -i "s#>dev<#>$V<#" taskpane.html word-taskpane.html workbench/index.html

          # A module that escaped stamping would quietly reintroduce the
          # stale-cache bug, so fail the deploy rather than ship it.
          if grep -rEn 'from "[.]{1,2}/[A-Za-z0-9_.-]*[.]js"|import[(]"[.]{1,2}/[A-Za-z0-9_.-]*[.]js"' *.js workbench/*.js; then
            echo "unstamped import -- would be cacheable and stale"
            exit 1
          fi
          for f in taskpane.html word-taskpane.html workbench/index.html; do
            # Existence first: `grep -q` on a missing file reports failure,
            # which reads as "no unstamped marker" and would let a page
            # that never got copied sail through.
            if [ ! -f "$f" ]; then
              echo "$f: missing from the build"
              exit 1
            fi
            if grep -q '>dev<' "$f"; then
              echo "$f: build marker not stamped"
              exit 1
            fi
          done
          # The Word pane renders through these; without them it loads and
          # then fails at the point of use, which is the worst place.
          for f in py/edufair_renderer/word/render.py py/edufair_renderer/word/blocks.py                    seed/template.pptx seed/layout-map.yaml seed/layout-geometry.json; do
            [ -f "$f" ] || { echo "$f: missing from the build"; exit 1; }
          done
          echo "stamped build $V"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
