name: Publish pane (tool only — no content, no decks)

# Deploys the assembler PANE as a static app to GitHub Pages: HTML/JS/CSS
# plus the edufair_renderer .py sources the in-browser (Pyodide) renderer
# imports. This publishes the TOOL, never content — no catalogs, no
# decks, no data directory. Rendering happens in each user's browser
# from markdown fetched straight out of git.
#
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the static pane (no data)
        run: |
          mkdir -p _site/py/edufair_renderer
          cp -r assembler/web/* _site/
          rm -rf _site/data _site/libraries
          cp renderer/src/edufair_renderer/*.py _site/py/edufair_renderer/
          # The landing page offers this for download; it lives a level up.
          cp assembler/manifest.web.xml _site/
          # The workbench is the authoring SPA; same static hosting, same
          # /py/ modules, so it ships alongside the pane.
          mkdir -p _site/workbench
          cp workbench/*.js workbench/*.css workbench/*.html _site/workbench/
          rm -rf _site/workbench/node_modules
      - name: Stamp the build so no browser can serve a stale module
        run: |
          # ES modules are cached hard, and Pages sends max-age=600 on every
          # file. Without this, a deploy can leave an author running a mix of
          # old and new modules with no way to tell -- which has already cost
          # a debugging round trip. Every relative import gets the commit sha,
          # so a new build simply cannot resolve to an old file.
          V="${GITHUB_SHA::8}"
          cd _site/workbench
          sed -i -E 's#from "[.]/[A-Za-z0-9_.-]+[.]js#&?v='"$V"'#g' *.js
          sed -i -E 's#src="app[.]js#&?v='"$V"'#; s#href="workbench[.]css#&?v='"$V"'#' index.html
          # And show it, so "which build am I on?" is answerable at a glance.
          sed -i "s#>dev<#>$V<#" index.html
          # A module that escaped stamping would quietly reintroduce the
          # stale-cache bug, so fail the deploy rather than ship it.
          if grep -q 'from "[.]/[A-Za-z0-9_.-]*[.]js"' *.js; then
            echo "unstamped import -- would be cacheable and stale:"
            grep -n 'from "[.]/[A-Za-z0-9_.-]*[.]js"' *.js
            exit 1
          fi
          echo "stamped workbench build $V"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
