name: Publish corpus

# Renders every session and publishes the task pane + corpus to GitHub
# Pages. The Pages site then serves double duty: it hosts the add-in
# itself (manifest.pages.xml points here) and it is a public "library"
# any other pane can add as a source.
#
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer
        run: pip install -e "renderer[test]"
      - name: Run renderer acceptance tests
        run: python -m pytest renderer/tests -q
      - name: Run assembler tests
        run: cd assembler && npm test
      - name: Build corpus
        run: python scripts/build_corpus.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: assembler/web
      - id: deployment
        uses: actions/deploy-pages@v4
