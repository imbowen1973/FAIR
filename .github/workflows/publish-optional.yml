name: Publish corpus (manual opt-in)

# DELIBERATELY manual. Publishing puts rendered decks on a public URL,
# which is right only for libraries meant as open educational resources.
# The default distribution model is local: authors pull the markdown,
# render on their own machine, and the task pane reads localhost.
#
# To publish: repo Settings -> Pages -> Source "GitHub Actions", then
# run this workflow from the Actions tab.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer
        run: pip install -e "renderer[test]"
      - name: Build corpus
        run: python scripts/build_corpus.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: assembler/web
      - id: deployment
        uses: actions/deploy-pages@v4
