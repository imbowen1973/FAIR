<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>eduFAIR Deck Assembler</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="taskpane.css"/>
</head>
<body>
  <header>
    <img src="assets/edufair-logo.png" alt="" class="brand"/>
    <div>
      <h1>eduFAIR Deck Assembler</h1>
      <p class="sub">Find slides across a course and build a deck</p>
    </div>
  </header>

  <main>
    <!-- Progress and errors are announced, not just shown: the render can
         take tens of seconds and a silent pane looks hung. -->
    <div id="status" class="status" role="status" aria-live="polite" hidden></div>

    <section id="step-source">
      <label for="source">Corpus</label>
      <div class="corpus-row">
        <select id="source"></select>
        <button id="toggle-add" title="Add a corpus" aria-label="Add a corpus">+</button>
        <button id="remove-source" title="Remove this corpus" aria-label="Remove this corpus" hidden>&times;</button>
      </div>
      <div class="corpus-row" id="branch-row" hidden>
        <label for="branch" class="branch-label">Branch</label>
        <select id="branch" title="Which branch of the library to render"></select>
      </div>
      <div class="add-source" id="add-source-row" hidden>
        <input id="new-source" placeholder="owner/repo · renders in your browser" spellcheck="false"/>
        <button id="add-source">Add</button>
      </div>
    </section>

    <section id="step-find">
      <label for="search">Find</label>
      <input id="search" type="search" placeholder="Search titles and speaker notes…" spellcheck="false"/>
      <label for="competency" class="visually-hidden">Filter by competency</label>
      <select id="competency" disabled>
        <option value="">All competencies</option>
      </select>
    </section>

    <section id="step-tree">
      <div class="tree-head">
        <h2 id="tree-heading">Course</h2>
        <button id="expand-all" class="link quiet">Expand all</button>
      </div>
      <div id="tree" role="tree" aria-labelledby="tree-heading"></div>
    </section>

    <section id="step-assemble" hidden>
      <p id="selection-summary" class="hint"></p>
      <button id="assemble" class="primary">Insert selected slides</button>
      <p class="hint">
        Slides insert below the selected slide with the destination theme.
        Within a deck, PowerPoint keeps the slides' original order.
      </p>
    </section>
  </main>

  <!-- Funder credit for the library currently open. Filled from that
       library's attribution.yaml via the catalog — never hard-coded
       here, because it differs per library and outlives any one grant. -->
  <footer id="funder" hidden>
    <img id="funder-logo" alt="" hidden/>
    <p id="funder-text" class="funder-text"></p>
  </footer>

  <!-- Which build this pane is running. The Office webview caches hard,
       and a pane serving a mix of old and new modules is exactly how the
       logo went missing after a rename -- this makes that answerable. -->
  <p class="build" title="If this does not match the latest commit, clear the Office cache.">
    build <code>dev</code>
  </p>

  <script type="module" src="taskpane.js"></script>
</body>
</html>
